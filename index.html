function validateBackup(s){const finite=(n,min=0)=>typeof n==='number'&&Number.isFinite(n)&&n>=min;const ds=d=>typeof d==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(d);if(!s||s.version!==1||!Array.isArray(s.watch)||!Array.isArray(s.trades)||!s.notes||typeof s.notes!=='object'||Array.isArray(s.notes))throw Error('Invalid backup structure');for(const [day,note] of Object.entries(s.notes))if(!ds(day)||typeof note!=='string')throw Error('Invalid session note');for(let w of s.watch)if(!/^[a-f0-9-]{36}$/.test(w.id)||typeof w.symbol!=='string')throw Error('Invalid watchlist');let ids=new Set();for(let t of s.trades){if(!/^[a-f0-9-]{36}$/.test(t.id)||ids.has(t.id)||typeof t.symbol!=='string'||!ds(t.date)||!ds(t.expiry)||!['Call','Put'].includes(t.side)||!finite(t.entry,.001)||!Number.isInteger(t.qty)||t.qty<1||!(finite(t.stop,.001)||(t.broker==='TD Active Trader'&&t.stop===null))||!finite(t.strike,.001)||!finite(t.mark)||!finite(t.close)||!finite(t.fees)||!Array.isArray(t.exits))throw Error('Invalid trade');ids.add(t.id);for(let e of t.exits)if(!Number.isInteger(e.qty)||e.qty<1||!finite(e.price)||!finite(e.fees)||!ds(e.date)||e.date<t.date)throw Error('Invalid exit');if(L.remaining(t)<0||(!L.remaining(t)&&!ds(t.closedDate)))throw Error('Invalid remaining contracts or closing date');}return s;}

async function compressScreenshot(file){
 if(!['image/png','image/jpeg','image/webp'].includes(file.type))throw Error('Use a PNG, JPEG, or WebP screenshot.');
 if(file.size>20*1024*1024)throw Error('Each original image must be under 20 MB.');
 const url=URL.createObjectURL(file);
 try{
  const img=new Image();img.src=url;await img.decode();
  const scale=Math.min(1,1600/Math.max(img.width,img.height));
  const c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*scale));c.height=Math.max(1,Math.round(img.height*scale));
  const g=c.getContext('2d');g.fillStyle='#ffffff';g.fillRect(0,0,c.width,c.height);g.drawImage(img,0,0,c.width,c.height);
  let quality=.85,data=c.toDataURL('image/jpeg',quality);
  while(data.length>600000&&quality>.35){quality-=.1;data=c.toDataURL('image/jpeg',quality);}
  if(data.length>650000)throw Error('This image is too detailed to store. Crop it and try again.');
  return {name:file.name||'Pasted screenshot',data};
 }finally{URL.revokeObjectURL(url);}
}

function earningsHtml(d){let out='';
 if(Array.isArray(d.earnings)){out+=`<h4 style="margin:14px 0 6px">Earnings outcomes</h4>`;out+=d.earnings.length?`<ul>${d.earnings.map(e=>`<li><b>${esc(e.symbol)}</b>${e.move?` <span class="${briefSign(e.move)}">${esc(e.move)}</span>`:''} · ${esc(e.result)}${e.meaning?` <b>What it means:</b> ${esc(e.meaning)}`:''} ${e.url?`<small class="muted">${weekLink(e.url,e.source||'source')}</small>`:e.source?`<small class="muted">[${esc(e.source)}]</small>`:''}</li>`).join('')}</ul>`:'<p class="muted">No major company reported since yesterday’s close.</p>';}
 const line=(label,v,cls)=>v?`<div style="margin-top:4px"><b class="${cls||''}">${label}</b> ${esc(v)}</div>`:'';
 if(Array.isArray(d.inPlay)&&d.inPlay.length){out+=`<h4 style="margin:14px 0 6px">Day-trade setups</h4>${d.inPlay.map((e,i)=>`<div class="level" style="margin:8px 0;padding:10px 12px"><div><b>${i+1}. ${esc(e.symbol)}</b>${e.linkedTo?` <small class="muted">via ${esc(e.linkedTo)}</small>`:''}${e.gap?` · <span class="${briefSign(e.gap)}">${esc(e.gap)}</span>`:''}<small class="muted"> · premarket ${esc(e.pmHigh||'—')} / ${esc(e.pmLow||'—')}${e.prevHigh?` · yesterday ${esc(e.prevHigh)} / ${esc(e.prevLow||'—')}`:''}</small></div><div style="margin-top:4px">${esc(e.why)}</div>${line('Momentum:',e.momentum)}${line('Options:',e.options)}${line('Calls side:',e.calls,'positive')}${line('Puts side:',e.puts,'negative')}</div>`).join('')}<small class="muted">Conditions to watch at the open, not trade instructions.</small>`;}
 if(Array.isArray(d.swings)&&d.swings.length){out+=`<h4 style="margin:14px 0 6px">Swing setups</h4>${d.swings.map((e,i)=>`<div class="level" style="margin:8px 0;padding:10px 12px"><div><b>${i+1}. ${esc(e.symbol)}</b>${e.linkedTo?` <small class="muted">via ${esc(e.linkedTo)}</small>`:''}</div><div style="margin-top:4px">${esc(e.why)}</div>${line('Trend:',e.trend)}${line('Options:',e.options)}${line('Confirms:',e.confirm,'positive')}${line('Invalidates:',e.invalidate,'negative')}</div>`).join('')}<small class="muted">Research, not trade instructions.</small>`;}
 return out;}
function flowsHtml(d){if(!Array.isArray(d.flows))return '';
 return `<h4 style="margin:14px 0 6px">Where the money is flowing</h4>${d.flowNote?`<p>${esc(d.flowNote)}</p>`:''}${d.flows.length?`<div class="scroll"><table><thead><tr><th>ETF</th><th>Sector</th><th>Premarket</th><th>Yesterday</th><th>5 days</th><th>1 month</th></tr></thead><tbody>${d.flows.map(f=>`<tr><td><b>${esc(f.symbol)}</b></td><td class="muted">${esc(f.name)}</td><td>${briefPct(f.premarket)}</td><td>${briefPct(f.yesterday)}</td><td>${briefPct(f.d5)}</td><td>${briefPct(f.d20)}</td></tr>`).join('')}</tbody></table></div>`:'<p class="muted">Sector quotes unavailable.</p>'}`;}
function briefBody(d){return `<div class="briefing-columns"><div><h4 style="margin:8px 0">Prices</h4><div class="scroll"><table><thead><tr><th>Instrument</th><th>Last</th><th>Change</th><th>As of</th></tr></thead><tbody>${d.prices.map(p=>`<tr><td>${esc(p.name)}</td><td>${esc(p.last)}</td><td class="${/▲/.test(p.change)?'positive':/▼/.test(p.change)?'negative':''}">${esc(p.change)}</td><td class="muted">${esc(p.asOf)}</td></tr>`).join('')}</tbody></table></div></div>
 <div><h4 style="margin:8px 0">Red news today (ET)</h4>${eventsTable(d.events,'No high-impact events listed for today.')}${d.tomorrow?`<h4 style="margin:8px 0">Red news tomorrow (ET)</h4>${eventsTable(d.tomorrow,'No high-impact events listed for tomorrow.')}`:''}</div></div>
 <h4 style="margin:14px 0 6px">Breaking macro</h4>${d.macro.length?`<ul>${d.macro.map(m=>`<li>${m.url?weekLink(m.url,esc(m.text)):esc(m.text)} <small class="muted">[${esc(m.source)}${m.time?' · '+esc(m.time):''}]</small></li>`).join('')}</ul>`:`<p class="muted">${d.slot&&d.slot!=='morning'?'Nothing market-moving in the feeds since the previous edition.':'Nothing market-moving in the feeds overnight.'}</p>`}
 ${Array.isArray(d.bigNames)?`<h4 style="margin:14px 0 6px">Big-name news</h4>${d.bigNames.length?`<ul>${d.bigNames.map(m=>`<li><b>${esc(m.symbol)}</b>${m.move?` <span class="${/^-/.test(m.move)?'negative':/^\+/.test(m.move)?'positive':''}">${esc(m.move)}</span>`:''} · ${m.url?weekLink(m.url,esc(m.text)):esc(m.text)} <small class="muted">[${esc(m.source||'')}${m.time?' · '+esc(m.time):''}]</small></li>`).join('')}</ul>`:'<p class="muted">No big company news worth flagging.</p>'}`:''}
 ${readthroughHtml(d)}
 <h4 style="margin:14px 0 6px">The read</h4><p>${esc(d.read||'')}</p>`;}
const briefBodyClassic=briefBody;
briefBody=function(d){if(!Array.isArray(d.earnings)&&!Array.isArray(d.inPlay)&&!Array.isArray(d.flows))return briefBodyClassic(d);
 const world=d.macro.length?`<h4 style="margin:14px 0 6px">World news, oil, bonds and the Fed</h4><ul>${d.macro.map(m=>`<li>${m.url?weekLink(m.url,esc(m.text)):esc(m.text)} <small class="muted">[${esc(m.source)}${m.time?' · '+esc(m.time):''}]</small></li>`).join('')}</ul>`:'';
 const ern=earningsHtml({earnings:d.earnings}),plays=earningsHtml({inPlay:d.inPlay,swings:d.swings});
 return `<h4 style="margin:8px 0 6px">Market conditions</h4><p>${esc(d.read||'')}</p>${world}${ern}${flowsHtml(d)}${plays}${readthroughHtml(d)}${briefBodyClassic({...d,read:'',macro:[],bigNames:d.bigNames&&d.bigNames.length?d.bigNames:undefined,readthrough:undefined,readthroughNext:undefined}).replace(/<h4 style="margin:14px 0 6px">The read<\/h4><p><\/p>$/,'').replace(/<h4 style="margin:14px 0 6px">Breaking macro<\/h4><p class="muted">[^<]*<\/p>/,'')}`;};
function drawMorningBrief(){const body=document.getElementById('morningBriefingBody');if(!body)return;let host=document.getElementById('agentBrief');if(!host){host=document.createElement('div');host.id='agentBrief';body.prepend(host);}
 if(!briefSet){host.innerHTML=briefError?`<p class="muted">AI briefs: ${esc(briefError)}.</p>`:location.protocol==='file:'?'<p class="muted">No AI briefs on this computer yet. The Trade Desk launcher adds the latest ones from GitHub each time it starts the app.</p>':'';return;}

 host.innerHTML=`<section class="level" style="margin-bottom:18px"><div class="row"><h3>AI briefs · ${esc(latest.date)}${latest.test?' · test run':''}</h3><small class="muted">${set.length} edition${set.length===1?'':'s'} · latest ${esc(briefAge(latest))}${stale?' · <b>not today’s</b>':''}</small></div>
 ${stale?'<div class="banner">These briefs are from an earlier day. On weekdays the morning brief arrives about 8:20 a.m. ET and the close review after 4:35 p.m.</div>':''}
 ${set.slice().reverse().map((d,i)=>`<details class="level" style="margin:10px 0" ${i===0?'open':''}><summary style="cursor:pointer"><b>${briefTitle(d)}</b> <small class="muted">· ${esc(briefAge(d))}</small></summary>${briefBody(d)}</details>`).join('')}
 <small class="muted">Written by the brief agent from Forex Factory, Yahoo Finance and news feeds. Not advice; check sources before trading.</small></section>`;}
const overviewBeforeBrief=drawOverviewFeeds;
drawOverviewFeeds=function(){overviewBeforeBrief();drawMorningBrief();loadMorningBrief(false);};
tdOnFreshness(()=>{if(document.getElementById('morningBriefingBody'))loadMorningBrief(true);});
// The dashboard may already be drawn (the feed module renders before this block loads): fill it in now.
if(document.getElementById('morningBriefingBody')){drawMorningBrief();loadMorningBrief(false);}
})();
</script><script type="application/x-trade-desk">// Chart snapshots: hand trade times to the desktop helper (agents/chart-snap) through a folder,
// then attach the PNGs it writes back. Nothing here touches the network; the helper runs on the PC.
(function(){
const SNAP_DAY_START='04:00',SNAP_DAY_END='20:00',
 SNAP_MAX=16,SNAP_BYTES=900000,SNAP_MAX_WIDTH=1600,
 // Extra markets photographed with every trade, one daily chart each (six months up to the trade day): the
 // 10-year Treasury yield (bonds and yields) and WTI crude oil.
 SNAP_MARKETS=[{symbol:'TVC:US10Y',name:'US10Y'},{symbol:'TVC:USOIL',name:'Crude oil'}];
let snapFolder=null,snapText=null,snapButton=null,snapBusy=false,snapLastScan=0,pendingImportOrders=[];
// Local link to the helper (PC launcher only): the launcher puts {url, token} into the local data block. With it,
// requests go to the helper and pictures come from it over this computer's loopback address, so the browser
// never needs folder access. Without it, the folder flow below is used.
let helper=null;try{const h=typeof tradeDeskLocalData==='function'?tradeDeskLocalData('helper'):null;if(h&&/^http:\/\/127\.0\.0\.1:\d{2,5}$/.test(String(h.url||''))&&/^[0-9a-f]{16,64}$/.test(String(h.token||'')))helper={url:h.url,token:h.token};}catch{}
async function helperFetch(path,opts={}){const r=await fetch(helper.url+path,{...opts,headers:{...(opts.headers||{}),'X-Trade-Desk-Token':helper.token},cache:'no-store',credentials:'omit',redirect:'error'});if(!r.ok)throw Error('chart helper answered '+r.status);return r;}
function snapDb(){return new Promise((resolve,reject)=>{const o=indexedDB.open('trade-desk-expanded-storage',1);o.onsuccess=()=>resolve(o.result);o.onerror=()=>reject(o.error);o.onupgradeneeded=()=>{o.transaction.abort();reject(Error('Storage not ready'));};});}
async function snapStore(mode,fn){const db=await snapDb();try{const tx=db.transaction('state',mode),store=tx.objectStore('state');const out=await fn(store);await new Promise((res,rej)=>{tx.oncomplete=res;tx.onabort=()=>rej(tx.error||Error('Storage transaction aborted'));});return out;}finally{db.close();}}
const req=r=>new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});
function snapSay(text,error){if(!snapText)return;snapText.textContent=text;snapText.style.color=error?'#ff9e9e':'';if(error){const d=document.getElementById('storageDetails');if(d)d.open=true;}}
function tradeEntry(t){return [...(t.entryTimes||[])].sort()[0]||null;}
function tradeExit(t){return [...(t.exits||[])].map(e=>e.time).filter(Boolean).sort().at(-1)||null;}
// Chart list: what you saw at entry (premarket to entry, nothing after), the trade through the last exit, the full day, and the index ETFs at entry.
function snapRequest(t){const entry=tradeEntry(t);if(!entry)return null;const day=entry.slice(0,10),at=hhmm=>day+' '+hhmm,exit=tradeExit(t),exitOrEntry=exit&&exit.slice(0,10)===day?exit:entry,sym=t.symbol;
 const charts=[{symbol:sym,interval:'2',label:'At entry · 2 min',from:at(SNAP_DAY_START),to:entry},{symbol:sym,interval:'5',label:'At entry · 5 min',from:at(SNAP_DAY_START),to:entry},{symbol:sym,interval:'5',label:'Through exit · 5 min',from:at(SNAP_DAY_START),to:exitOrEntry},{symbol:sym,interval:'5',label:'Full day · 5 min',from:at(SNAP_DAY_START),to:at(SNAP_DAY_END)},{symbol:'SPY',interval:'5',label:'SPY at entry · 5 min',from:at(SNAP_DAY_START),to:entry},{symbol:'QQQ',interval:'5',label:'QQQ at entry · 5 min',from:at(SNAP_DAY_START),to:entry},
  ...SNAP_MARKETS.map(m=>({symbol:m.symbol,interval:'D',label:m.name+' · daily, 6 months',from:new Date(Date.parse(day+'T12:00:00Z')-182*864e5).toISOString().slice(0,10)+' 09:30',to:at(SNAP_DAY_END)}))];
 charts.forEach(c=>{c.moment=c.interval==='D'||/full day/i.test(c.label)?'':/exit/i.test(c.label)?'exit':'entry';});
 // entryAt/exitAt carry the fill time (to the minute from TD exports; the helper finds the second from the option's prints at entryPrice/exitPrice), so the helper can draw the last candle as it stood at that second and the entry/exit price lines.
 return {version:3,id:t.id,symbol:sym,date:t.date,entry:entry.slice(0,16),exit:exit?exit.slice(0,16):null,entryAt:entry.slice(0,19),exitAt:exit&&exit.slice(0,10)===day?exit.slice(0,19):null,option:t.expiry&&t.strike!=null&&t.side?{expiry:t.expiry,strike:t.strike,side:t.side}:null,entryPrice:Number.isFinite(+t.entry)?+t.entry:null,exitPrice:(()=>{const e=[...(t.exits||[])].filter(x=>x.time).sort((a,b)=>a.time.localeCompare(b.time)).at(-1);return e&&Number.isFinite(+e.price)?+e.price:null;})(),charts,created:new Date().toISOString()};}
async function snapPermission(){if(!snapFolder)return false;if(await snapFolder.queryPermission({mode:'readwrite'})==='granted')return true;return (await snapFolder.requestPermission({mode:'readwrite'}))==='granted';}
async function writeRequests(trades){if((!snapFolder&&!helper)||!trades.length)return 0;
 if(helper){let n=0;for(const t of trades){const r=snapRequest(t);if(!r)continue;await helperFetch('/requests',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(r)});n++;}return n;}
 if(!await snapPermission()){snapSay('Chart snapshots paused: allow folder access to queue requests.',true);return 0;}
 const dir=await snapFolder.getDirectoryHandle('requests',{create:true});let n=0;
 for(const t of trades){const r=snapRequest(t);if(!r)continue;const file=await dir.getFileHandle(t.id+'.json',{create:true});const w=await file.createWritable();try{await w.write(JSON.stringify(r,null,1));await w.close();n++;}catch(e){try{await w.abort();}catch{}throw e;}}
 return n;}
async function requestCharts(ids,quiet){try{const trades=state.trades.filter(t=>ids.includes(t.id));const missing=trades.filter(t=>!tradeEntry(t));if(missing.length&&!quiet)alert('No entry time on: '+missing.map(t=>t.symbol).join(', ')+'. Import the broker CSV to add entry times, then request again.');
 if(!snapFolder&&!helper){if(!quiet)alert('Choose the chart snapshots folder first (Storage & backups panel at the bottom of the page).');return;}
 const n=await writeRequests(trades);snapSay(n?`${n} chart request${n===1?'':'s'} queued · the helper on your PC will capture them`:'No chart requests written.');if(n&&!quiet)toast(`${n} chart request${n===1?'':'s'} queued`);}catch(e){snapSay('Chart request failed: '+e.message,true);}}
function toJpeg(blob){return new Promise((resolve,reject)=>{const url=URL.createObjectURL(blob),img=new Image();img.onload=()=>{try{const scale=Math.min(1,SNAP_MAX_WIDTH/img.naturalWidth),c=document.createElement('canvas');c.width=Math.round(img.naturalWidth*scale);c.height=Math.round(img.naturalHeight*scale);c.getContext('2d').drawImage(img,0,0,c.width,c.height);let q=0.85,out=c.toDataURL('image/jpeg',q);while(out.length>SNAP_BYTES&&q>0.4){q-=0.1;out=c.toDataURL('image/jpeg',q);}resolve(out);}catch(e){reject(e);}finally{URL.revokeObjectURL(url);}};img.onerror=()=>{URL.revokeObjectURL(url);reject(Error('Unreadable image'));};img.src=url;});}
// Save a finished set of pictures on its trade. Returns true when saved.
// A manifest with "append": true adds its pictures (e.g. Bookmap screenshots) to the trade's existing set instead of
// replacing it; a normal (TradingView) set replaces the set but keeps any added pictures (names starting "Bookmap").
async function attachImages(name,manifest,loadBlob){const trade=state.trades.find(t=>t.id===name);if(!trade||!manifest||!Array.isArray(manifest.images))return false;const images=[];
 for(const item of manifest.images.slice(0,SNAP_MAX)){if(!item||typeof item.file!=='string'||!/^[\w.-]+\.png$/.test(item.file))continue;try{const blob=await loadBlob(item.file);if(blob.size>8000000)continue;images.push({name:String(item.label||item.file).slice(0,80),data:await toJpeg(blob)});}catch{}}
 if(!images.length)return false;
 const old=trade.chartSnapshots||[],added=old.filter(i=>/^Bookmap/i.test(i.name||''));
 const set=manifest.append?[...old.filter(i=>!images.some(n=>n.name===i.name)),...images]:[...images,...added.filter(i=>!images.some(n=>n.name===i.name))];
 const next={...state,trades:state.trades.map(t=>t.id===name?{...t,chartSnapshots:set.slice(-SNAP_MAX),chartSnapshotsAt:manifest.append?(t.chartSnapshotsAt||manifest.captured||new Date().toISOString()):(manifest.captured||new Date().toISOString())}:t)};
 try{validateBackup(next);localStorage.setItem(KEY,JSON.stringify(next));state=next;}catch(e){snapSay('Chart snapshots not saved for '+trade.symbol+': '+e.message,true);return false;}
 return true;}
function attachedNotice(attached){if(attached){snapSay(`Attached chart snapshots to ${attached} trade${attached===1?'':'s'} · ${new Date().toLocaleTimeString('en-US',{timeZone:'America/Toronto'})} ET`);toast(`Chart snapshots attached · ${attached} trade${attached===1?'':'s'}`);render();}}
async function attachDone(){if((!snapFolder&&!helper)||snapBusy)return;snapBusy=true;try{
 if(helper){const {done}=await (await helperFetch('/done')).json();let attached=0;
  for(const manifest of Array.isArray(done)?done:[]){const name=String(manifest?.id||'');if(!/^[\w-]{1,80}$/.test(name)||!state.trades.some(t=>t.id===name))continue;
   const folder=/^[\w-]{1,120}$/.test(String(manifest.folder||''))?manifest.folder:name;
   if(await attachImages(name,manifest,file=>helperFetch('/done/'+encodeURIComponent(folder)+'/'+encodeURIComponent(file)).then(r=>r.blob()))){try{await helperFetch('/done/'+encodeURIComponent(folder)+'/ack',{method:'POST'});}catch{}attached++;}}
  attachedNotice(attached);return;}
 if(await snapFolder.queryPermission({mode:'readwrite'})!=='granted')return;
 let done;try{done=await snapFolder.getDirectoryHandle('done');}catch{return;}
 let attached=0;for await(const [name,handle]of done.entries()){if(handle.kind!=='directory'||!state.trades.some(t=>t.id===name))continue;
  let manifest;try{manifest=JSON.parse(await (await (await handle.getFileHandle('manifest.json')).getFile()).text());}catch{continue;}
  if(await attachImages(name,manifest,async file=>(await handle.getFileHandle(file)).getFile())){try{await done.removeEntry(name,{recursive:true});}catch{}attached++;}}
 attachedNotice(attached);
 }catch(e){snapSay('Chart snapshot check failed: '+e.message,true);}finally{snapBusy=false;}}
// Automatic requests: every trade with an entry time and no pictures yet is queued (at most 25 per pass, once
// per app session per trade). A trade already waiting in requests/, being captured in work/, or parked in
// failed/ is left alone; "Re-capture" / "Request charts" on the trade still works for those.
const autoQueued=new Set();
// Pictures taken before this moment are in an older style (since 28 Oct: big Entry/Exit tags right of the middle, arrows at the entry and exit candles on the full-day chart; 27 Oct: entry/exit line from the chart's own candle when fine bars fail; 26 Oct: oil and the 10-year as daily charts; 25 Oct: last candle as of the fill second, entry/exit price lines): capture them
// again once. Bump the date whenever the helper's picture style changes and older pictures should be redone.
const SNAP_STYLE_SINCE='2026-10-28T09:02:00Z';
const needsCharts=t=>!t.chartSnapshots||String(t.chartSnapshotsAt||'')<SNAP_STYLE_SINCE;
async function folderHas(dir,id){try{const d=await snapFolder.getDirectoryHandle(dir);if(dir==='work')await d.getDirectoryHandle(id);else await d.getFileHandle(id+'.json');return true;}catch{return false;}}
async function autoQueueMissing(){if((!snapFolder&&!helper)||snapBusy)return;try{if(!helper&&await snapFolder.queryPermission({mode:'readwrite'})!=='granted')return;
 const todo=state.trades.filter(t=>tradeEntry(t)&&needsCharts(t)&&!autoQueued.has(t.id)).slice(0,25);
 if(!todo.length){if(state.trades.length&&!state.trades.some(t=>tradeEntry(t)))snapSay('Charts need entry times, and none of your trades has one yet. Use Import broker trades (your broker CSV); charts are then requested on their own.',true);return;}
 let busy=null;if(helper){const q=await (await helperFetch('/queue')).json();busy=new Set([...(q.requests||[]),...(q.work||[]),...(q.failed||[])]);}
 const fresh=[];for(const t of todo){autoQueued.add(t.id);if(busy?busy.has(t.id):(await folderHas('requests',t.id)||await folderHas('work',t.id)||await folderHas('failed',t.id)))continue;fresh.push(t);}
 if(!fresh.length)return;const n=await writeRequests(fresh);if(n)snapSay(`${n} chart request${n===1?'':'s'} queued automatically · the helper on your PC will capture them`);}
 catch(e){snapSay('Automatic chart requests failed: '+e.message,true);}}
// A banner at the top of the page, with its own button, whenever the browser still has to be told the app may
// use the folder (browsers only accept that from a click, and the prompt is easy to miss).
function chartAccessBanner(show){let b=document.getElementById('chartAccessBanner');if(!show){if(b)b.remove();return;}if(b||!document.getElementById('app'))return;
 b=document.createElement('div');b.id='chartAccessBanner';b.className='banner';b.style.cssText='margin:12px 0;display:flex;gap:12px;align-items:center;flex-wrap:wrap';
 const text=document.createElement('span');text.textContent='Chart snapshots are paused until Edge lets Trade Desk use the chart folder.';
 const btn=document.createElement('button');btn.type='button';btn.textContent='Allow chart folder access';
 btn.onclick=async()=>{try{if(await snapFolder.requestPermission({mode:'readwrite'})==='granted'){chartAccessBanner(false);snapSay('Chart snapshots folder access allowed.');snapLastScan=0;scanSoon();}else snapSay('Chart snapshots paused: folder access was not allowed.',true);}catch(e){snapSay('Chart snapshots paused: '+e.message,true);}};
 b.append(text,btn);document.getElementById('app').before(b);}
async function checkChartAccess(){if(helper||!snapFolder){chartAccessBanner(false);return;}try{chartAccessBanner((await snapFolder.queryPermission({mode:'readwrite'}))!=='granted');}catch{}}
function scanSoon(){const now=Date.now();if(now-snapLastScan<15000)return;snapLastScan=now;checkChartAccess().then(attachDone).then(autoQueueMissing);}
// Folder access must be re-allowed once per app launch, and the browser only asks during a click: use the
// first click anywhere in the app for that, so nothing has to be found at the bottom of the page.
let regrantTried=false;
async function regrantOnClick(){if(regrantTried||helper||!snapFolder)return;regrantTried=true;try{if(await snapFolder.queryPermission({mode:'readwrite'})==='granted')return;
 if(await snapFolder.requestPermission({mode:'readwrite'})==='granted'){snapSay('Chart snapshots folder access allowed.');snapLastScan=0;scanSoon();}
 else snapSay('Chart snapshots paused: allow folder access (Storage & backups at the bottom of the page).',true);}catch(e){snapSay('Chart snapshots paused: '+e.message,true);}}
document.addEventListener('click',regrantOnClick,true);
// Saved-data rules for the new field. Old backups without it stay valid.

 async function downloadRecovery(){const rec=await latestRecovery();if(!rec){alert('No recoverable data was found. Your computer backup folder may still have dated backups.');return;}if(rec.note&&!confirm(rec.note+'\n\nDownload it anyway?'))return;download(rec.value,rec.label);}
 async function download(value,label='latest'){if(!value)return;try{const pass=TradeDeskSecurity.password||await TradeDeskSecurity.askPassword(true);if(!pass)return;const payload=await TradeDeskSecurity.encrypt(value,pass);const url=URL.createObjectURL(new Blob([payload],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='trade-desk-recovery-'+label+'-encrypted-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),10000);}catch(e){alert('Encrypted backup failed: '+e.message);}}

 const request=r=>new Promise((resolve,reject)=>{r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error);});
 function transactionDone(tx){return new Promise((resolve,reject)=>{tx.oncomplete=resolve;tx.onabort=()=>reject(tx.error||Error('Save transaction aborted'));tx.onerror=()=>{};});}
 async function pack(value){const images=new Map(),hashes=new Map();async function walk(node){if(typeof node==='string'&&/^data:image\/(jpeg|png|webp);base64,/.test(node)){let id=hashes.get(node);if(!id){const digest=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(node));id=Array.from(new Uint8Array(digest),b=>b.toString(16).padStart(2,'0')).join('');hashes.set(node,id);images.set(id,node);}return {__tradeDeskImage:id};}if(Array.isArray(node))return Promise.all(node.map(walk));if(node&&typeof node==='object'){const out={};for(const [key,item]of Object.entries(node))out[key]=await walk(item);return out;}return node;}return {data:await walk(JSON.parse(value)),images};}
 async function hydrate(data){const ids=new Set();function collect(v){if(v&&typeof v==='object'){if(typeof v.__tradeDeskImage==='string'){ids.add(v.__tradeDeskImage);return;}Object.values(v).forEach(collect);}}collect(data);const images=new Map();if(ids.size){const tx=db.transaction('images','readonly'),done=transactionDone(tx);await Promise.all([...ids].map(async id=>{const value=await request(tx.objectStore('images').get(id));if(typeof value!=='string')throw Error('A saved screenshot is missing.');images.set(id,value);}));await done;}function expand(v){if(v&&typeof v==='object'){if(typeof v.__tradeDeskImage==='string')return images.get(v.__tradeDeskImage);if(Array.isArray(v))return v.map(expand);return Object.fromEntries(Object.entries(v).map(([k,item])=>[k,expand(item)]));}return v;}return JSON.stringify(expand(data));}
 async function write(value,expected){const packed=await pack(value);const tx=db.transaction(['state','images'],'readwrite'),done=transactionDone(tx),states=tx.objectStore('state');let conflict=false;const get=states.get(KEY);get.onsuccess=()=>{const current=get.result;if((current?.revision||0)!==expected){conflict=true;tx.abort();return;}if(current)states.put(current,'previous');for(const [id,image]of packed.images)tx.objectStore('images').put(image,id);states.put({revision:expected+1,data:packed.data},KEY);};try{await done;}catch(e){if(conflict)throw Error('Another Trade Desk window saved newer data. Export this window’s recovery backup before reloading.');throw e;}return expected+1;}
 function queue(value){pending++;show('Saving to expanded storage… Keep this window open until saved.');chain=chain.then(async()=>{if(failed)throw Error('A previous save failed.');revision=await write(value,revision);committed=value;await diskBackup(value);await refreshStorageMeter();}).catch(e=>{failed=true;show('NOT SAVED: '+e.message+' Your last successful database save remains intact.',true);}).finally(()=>{pending--;if(!pending&&!failed)show('Saved · Expanded storage · Screenshots shared across weekly archives');});}
 window.addEventListener('beforeunload',e=>{if(pending||failed){e.preventDefault();e.returnValue='';}});
 try{
  show('Opening expanded storage and checking existing data…');
  const opening=indexedDB.open('trade-desk-expanded-storage',1);opening.onupgradeneeded=()=>{opening.result.createObjectStore('state');opening.result.createObjectStore('images');};opening.onblocked=()=>show('Close other Trade Desk windows, then reload to finish the storage upgrade.',true);db=await request(opening);
  const tx=db.transaction('state','readonly'),done=transactionDone(tx),record=await request(tx.objectStore('state').get(KEY));await done;
  if(record){revision=record.revision;cache=await hydrate(record.data);cacheSource='database';}else if(original){JSON.parse(original);revision=await write(original,0);try{nativeSet.call(localStorage,MIGRATED_AT_KEY,new Date().toISOString());}catch{}const verifyTx=db.transaction('state','readonly'),verified=await request(verifyTx.objectStore('state').get(KEY));cache=await hydrate(verified.data);if(JSON.stringify(JSON.parse(cache))!==JSON.stringify(JSON.parse(original)))throw Error('Migration verification failed. Original storage has not been changed.');cacheSource='database';}
  Storage.prototype.getItem=function(key){return this===localStorage&&key===KEY?cache:nativeGet.call(this,key);};
  Storage.prototype.setItem=function(key,value){if(this===localStorage&&key===KEY){if(failed)throw Error('Expanded storage save failed; export a recovery backup before reloading.');const text=String(value);JSON.parse(text);cache=text;cacheSource='session';queue(text);return;}return nativeSet.call(this,key,value);};
  committed=cache;
  await refreshStorageMeter();
  const folderTx=db.transaction('state','readonly');backupFolder=await request(folderTx.objectStore('state').get('backup-folder'))||null;
  backupButton.disabled=false;if(backupFolder){backupButton.textContent='Allow backups / settings';scheduleDiskBackup();}
  window.TradeDeskStorage={flush:()=>chain,backup:()=>downloadRecovery()};
  show('Expanded storage ready · Existing data preserved');
  for(const source of document.querySelectorAll('script[type="application/x-trade-desk"]')){const script=document.createElement('script');if(source.dataset.src){script.src=source.dataset.src;await new Promise((resolve,reject)=>{script.onload=resolve;script.onerror=()=>reject(Error('App source failed to load'));document.body.append(script);});}else{script.textContent=source.textContent;document.body.append(script);}}
 }catch(e){show('Storage upgrade could not finish: '+e.message+' Original browser data was not removed.',true);}
})();
</script></body></html>
