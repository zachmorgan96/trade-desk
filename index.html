function manageSetups(returnId){

function sectionAt(timestamp){

 }).join('');

function validateDailyUpdates(entries){
 if(!Array.isArray(entries))throw Error('Invalid daily journal');
 const ids=new Set();
 for(const e of entries){
  if(!e||!/^[a-f0-9-]{36}$/.test(e.id)||ids.has(e.id)||!/^\d{4}-\d{2}-\d{2}$/.test(e.date)||typeof e.text!=='string'||e.text.length>30000||!Number.isFinite(Date.parse(e.created))||!Array.isArray(e.images)||e.images.length>4)throw Error('Invalid daily entry');

validateBackup=function(s){originalValidateBackup(s);validateDailyUpdates(s.dailyUpdates||[]);return s;};
function commitDailyUpdates(entries){

const stamp=s=>new Intl.DateTimeFormat('en-US',{timeZone:'America/Toronto',hour:'numeric',minute:'2-digit'}).format(new Date(s));
let journalMonth='',calendarSelectedDate='';
let journalCalendarCollapsed=false;
try{journalCalendarCollapsed=localStorage.getItem('trade-desk-calendar-collapsed')==='true';}catch{}

}
function calendarDayPnl(day){return L.periodReturn(state.trades,day,day);}
function signedCalendarMoney(value){const v=Math.abs(value)<.005?0:value;return (v>0?'+':v<0?'-':'')+money(Math.abs(v));}
function calendarMonthPnl(month){return L.periodReturn(state.trades,month+'-01',month+'-31');}
function calendarYearPnl(year){return L.periodReturn(state.trades,year+'-01-01',year+'-12-31');}
function journalMonthStats(month){
 const trades=state.trades.filter(t=>t.date.slice(0,7)===month);
 const closed=trades.filter(t=>L.remaining(t)===0);
 const wins=closed.filter(t=>L.realized(t)>.005).length;
 const losses=closed.filter(t=>L.realized(t)<-.005).length;
 return {total:trades.length,closed:closed.length,open:trades.length-closed.length,wins,losses,breakeven:closed.length-wins-losses,winRate:closed.length?wins/closed.length*100:null};

function renderMonthTradeStats(month){

 return `<div class="monthly-trade-stats"><div><span class="eyebrow">MONTHLY WIN RATE</span><div class="calendar-day-total">${s.winRate===null?'—':s.winRate.toFixed(1)+'%'}</div><small>${s.wins} winning / ${s.closed} completed trades</small></div><div><span class="eyebrow">TOTAL TRADES · ${calendarMonthInfo(month).label.toUpperCase()}</span><div class="calendar-day-total">${s.total}</div><small>${s.closed} completed · ${s.open} open</small></div><p class="muted">Based on trades entered in the displayed month. Win rate = net-winning trades ÷ completed trades, after fees. Breakeven trades count as completed, not wins. Partial exits do not count as separate trades.</p></div>`;

 return `<section class="card journal-performance ${panelCollapsed('performance')?'panel-is-collapsed':''}"><div class="row performance-heading"><h2>Performance overview</h2><div class="actions"><small>${m.label} · %</small>${panelButton('performance','overview')}</div></div><div id="panel-performance" ${panelCollapsed('performance')?'hidden':''}><div class="performance-layout ${panelCollapsed('graph')?'graph-is-collapsed':''}"><div class="performance-metrics"><div class="performance-metric"><span class="eyebrow">${m.year} · YEARLY RETURN</span><div class="calendar-day-total ${year.tone}">${L.percent(year.net)}</div><small>January–December ${m.year}</small></div><div class="performance-metric"><span class="eyebrow">MONTHLY RETURN</span><div class="calendar-day-total ${month.tone}">${L.percent(month.net)}</div><small>${m.label}</small></div><div class="performance-metric"><span class="eyebrow">COMPLETED TRADES · ALL TIME</span><div class="calendar-day-total">${closed.length}</div></div><div class="performance-metric"><span class="eyebrow">WIN RATE · COMPLETED</span><div class="calendar-day-total">${closed.length?Math.round(wins/closed.length*100)+'%':'—'}</div><small>All time</small></div></div>${renderCumulativeJournal()}</div><details class="performance-help"><summary>How these numbers are calculated</summary><p>Returns are weighted by the entry cost of contracts sold, including allocated entry fees and exit fees. Partial exits count on their exit date. Open contracts are excluded. These are trade-cost returns, not account returns; percentages are not summed or compounded. Completed trade count and win rate cover all recorded history. Win rate is net-winning trades divided by all completed trades; breakevens count as completed, not wins. Partials are not separate trades. The graph starts at 0% and shows the cumulative weighted return for the selected period. Year and month views follow the calendar; all-time includes all recorded history. Hover over graph points or function setJournalChartRange(range){if(['all','year','month'].includes(range)){journalChartRange=range;render();}}
function cumulativeJournalData(range,month){const start=range==='all'?'':range==='year'?month.slice(0,4)+'-01-01':month+'-01';const end=range==='all'?'9999-12-31':range==='year'?month.slice(0,4)+'-12-31':month+'-31';const dates=[...new Set(state.trades.flatMap(t=>t.exits.map(e=>e.date)))].filter(d=>d>=start&&d<=end).sort();return dates.map(day=>({date:day,daily:calendarDayPnl(day).net,total:L.periodReturn(state.trades,start,day).net}));}
function renderCumulativeJournal(){
 const points=cumulativeJournalData(journalChartRange,journalMonth);
 const period=journalChartRange==='all'?'All recorded history':journalChartRange==='year'?journalMonth.slice(0,4):calendarMonthInfo(journalMonth).label;
 const total=points.at(-1)?.total||0,tone=total>0?'day-profit':total<0?'day-loss':'day-flat';
 let graph='';
 if(points.length){
  const width=900,height=210,left=80,right=25,top=25,bottom=48;
  const epoch=day=>Date.parse(day+'T00:00:00Z');
  const start=journalChartRange==='all'?epoch(points[0].date)-86400000:epoch(journalChartRange==='year'?journalMonth.slice(0,4)+'-01-01':journalMonth+'-01')-86400000;
  const end=Math.max(start+86400000,epoch(points.at(-1).date));

 }else graph='<div class="compact-chart-empty">No recorded trading activity in this period.<br><small>Your graph appears when trades are logged.</small></div>';
 return `<section class="cumulative-journal compact-chart"><div class="row"><h3>Cumulative return</h3>${panelButton('graph','graph')}</div><div id="panel-graph" ${panelCollapsed('graph')?'hidden':''}><div class="actions chart-range-controls" role="group" aria-label="Chart period">${[['all','All time'],['year','Year'],['month','Month']].map(([id,label])=>`<button class="${journalChartRange===id?'primary':''}" aria-pressed="${journalChartRange===id}" data-td-click="h24" data-td-a0="${esc(id)}">${label}</button>`).join('')}</div><div class="row chart-period"><small>${esc(period)}</small><strong class="calendar-day-total ${tone}">${L.percent(total)}</strong></div>${graph}</div></section>`;

function journalDaySummary(day){
 const updates=(state.dailyUpdates||[]).filter(e=>e.date===day);
 return {updates:updates.length,notes:updates.filter(e=>e.text.trim()).length+(String(state.notes[day]||'').trim()?1:0),images:updates.reduce((n,e)=>n+e.images.length,0)};

function calendarMonthInfo(month){
 const [year,m]=month.split('-').map(Number);

function calendarWeekTotals(month){
 const m=calendarMonthInfo(month),weeks=[];
 for(let row=0;row<Math.ceil((m.offset+m.days)/7);row++){
  const dates=Array.from({length:7},(_,i)=>new Date(Date.UTC(m.year,m.month-1,1-m.offset+row*7+i)).toISOString().slice(0,10));
  let cents=0,activity=false;
  for(const day of dates){const p=calendarDayPnl(day);cents+=Math.round(p.net*100);activity=activity||p.activity;}
  const net=L.periodReturn(state.trades,dates[0],dates[6]).profit;
  weeks.push({start:dates[0],end:dates[6],net,activity,tone:net>0?'day-profit':net<0?'day-loss':'day-flat'});

}
function calendarRowsWithTotals(cells,month){

 while(cells.length<weeks.length*7)cells.push('<span class="calendar-blank" aria-hidden="true"></span>');

function selectedDayTickerReturns(day){
 const symbols=[...new Set(state.trades.filter(t=>t.exits.some(e=>e.date===day)).map(t=>t.symbol))].sort();

  return `<div class="calendar-day-total ${result.tone}"><span style="color:var(--text);font-size:18px">${esc(symbol)}</span> ${signedCalendarMoney(result.profit)}</div><div class="selected-trade-metrics"><div><small>Avg entry</small><strong>${money(entry/qty)}</strong></div><div><small>Avg exit</small><strong>${money(exit/qty)}</strong></div><div><small>Net P&amp;L</small><strong class="${pnlClass(result.profit)}">${signedCalendarMoney(result.profit)}</strong></div></div>`;

function calendarTickerLabels(day){

function renderJournalCalendar(){

async function compressScreenshot(file){
 if(!['image/png','image/jpeg','image/webp'].includes(file.type))throw Error('Use a PNG, JPEG, or WebP screenshot.');
 if(file.size>20*1024*1024)throw Error('Each original image must be under 20 MB.');
 const url=URL.createObjectURL(file);
 try{
  const img=new Image();img.src=url;await img.decode();
  const scale=Math.min(1,1600/Math.max(img.width,img.height));
  const c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*scale));c.height=Math.max(1,Math.round(img.height*scale));
  const g=c.getContext('2d');g.fillStyle='#ffffff';g.fillRect(0,0,c.width,c.height);g.drawImage(img,0,0,c.width,c.height);
  let quality=.85,data=c.toDataURL('image/jpeg',quality);
  while(data.length>600000&&quality>.35){quality-=.1;data=c.toDataURL('image/jpeg',quality);}
  if(data.length>650000)throw Error('This image is too detailed to store. Crop it and try again.');
  return {name:file.name||'Pasted screenshot',data};
 }finally{URL.revokeObjectURL(url);}
}

 // The brief's setups graded after the close (agents/takeaways/setups.py). "You" = a journal trade in that ticker that day.
 const RES={followed:['tk-s-trend','followed through'],small:['tk-s-none','small move'],faded:['tk-s-chop','faded'],nobreak:['tk-s-none','no break']};

 const tradedSym=(day,t)=>(state.trades||[]).some(x=>x.date===day&&String(x.symbol).toUpperCase()===t);
 function setupsDay(entry){const s=entry.setups,day=entry.measured.date;if(!s||typeof s!=='object')return '';
  const D=Array.isArray(s.day)?s.day:[],W=Array.isArray(s.swing)?s.swing:[];if(!D.length&&!W.length)return '';

   if(b.failedAt&&b.failedAt===b.time)return `broke the premarket ${b.side==='up'?'high':'low'} ${N(b.level)} at ${esc(S(b.time))} but closed back inside on that same 5-minute candle`;
   return `broke the premarket ${b.side==='up'?'high':'low'} ${N(b.level)} at ${esc(S(b.time))} · ran ${N(b.runBeforeFail)===null?'—':b.runBeforeFail.toFixed(2)+'%'} ${b.side==='up'?'higher':'lower'} before ${b.failedAt?'closing back inside at '+esc(S(b.failedAt)):'the close (never failed)'}`;};

   ${W.length?`<div class="scroll"><table><tr><th>Swing</th><th>Confirms</th><th>Invalidates</th><th>Status</th><th>Since the brief</th></tr>${W.map(x=>`<tr><td><b>${esc(S(x.ticker))}</b><br><small class="muted">${esc(S(x.setup))}</small></td><td>${N(x.confirmLevel)===null?'—':'close '+esc(S(x.confirmSide))+' '+x.confirmLevel}</td><td>${N(x.invalidLevel)===null?'—':'close '+esc(S(x.invalidSide))+' '+x.invalidLevel}</td><td>${ST[x.status]?sign(ST[x.status][0],ST[x.status][1]):'—'}${x.statusDate?` <small class="muted">${esc(S(x.statusDate))}</small>`:''}</td><td class="${pnlClass(x.change)}">${p2(x.change)}${x.lastDate?` <small class="muted">to ${esc(S(x.lastDate))}</small>`:''}</td></tr>`).join('')}</table></div>`:''}

 function setupStats(){const st=data.setupStats;if(!st||!Array.isArray(st.day)||!st.days)return '';
  const pc=(a,n)=>n?Math.round(a/n*100)+'%':'—',sw=st.swing||{};

   <div class="scroll"><table><tr><th>Swing type</th><th>Ideas</th><th>Confirmed</th><th>Invalidated first</th><th>Waiting</th><th>Worked after confirming</th><th>Failed after confirming</th><th>Still open</th></tr>
   ${(Array.isArray(si.families)?si.families:[]).map(f=>`<tr><td>${esc(S(f.family))}</td><td>${z(f.ideas)}</td><td>${z(f.confirmed)}</td><td>${z(f.invalidated)}</td><td>${z(f.waiting)}</td><td class="${z(f.worked)?'positive':''}">${z(f.worked)}</td><td class="${z(f.failed)?'negative':''}">${z(f.failed)}</td><td>${z(f.open)}</td></tr>`).join('')}</table></div>
   <p class="muted"><small>A swing only becomes a trade on its confirming close, so one that is invalidated first cost nothing but attention. "Worked" means it moved at least the distance from the confirming close to its invalidation level; "failed" means a later close went through that level first.</small></p>`;
  const sum=(rows,k)=>(Array.isArray(rows)?rows:[]).reduce((n,r)=>n+z(r[k]),0);
  const periodBlock=!Array.isArray(st.periods)||!st.periods.length?'':`<h3 style="margin-top:16px">Before and since the six morning checks</h3>
   <div class="scroll"><table><tr><th>Period</th><th>Briefs</th><th>Day-trade setups</th><th>Followed through</th><th>Faded</th><th>Swing ideas</th><th>Confirmed</th><th>Invalidated first</th></tr>
   ${st.periods.map(p=>{const n=sum(p.day,'n'),q=p.swingIdeas||{};return `<tr><td>${esc(S(p.label))}</td><td>${z(p.days)}</td><td>${n}</td><td>${pc(sum(p.day,'followed'),n)}</td><td>${pc(sum(p.day,'faded'),n)}</td><td>${z(q.ideas)}</td><td>${z(q.confirmed)}</td><td>${z(q.invalidated)}</td></tr>`;}).join('')}</table></div>
   <p class="muted"><small>Since 13 Nov every setup must pass six checks each morning or it is dropped. The two rows show whether that changes the record; the new row needs a few weeks before it means anything.</small></p>`;
  return `<section class="card"><span class="eyebrow">THE BRIEF, GRADED · ${st.days} BRIEFS</span><h2>How the brief's setups have done</h2>
   <div class="scroll"><table><tr><th>Day-trade setup type</th><th>Setups</th><th>Followed through</th><th>Small move</th><th>Faded</th><th>No break</th><th>Average run before failing</th><th>Gap filled</th></tr>
   ${st.day.map(r=>`<tr><td>${esc(S(r.family))}</td><td>${r.n}</td><td class="${r.followed/r.n>=.5?'positive':''}">${pc(r.followed,r.n)}</td><td>${pc(r.small,r.n)}</td><td class="${r.faded/r.n>=.3?'negative':''}">${pc(r.faded,r.n)}</td><td>${pc(r.nobreak,r.n)}</td><td>${N(r.avgRun)===null?'—':r.avgRun.toFixed(2)+'%'}</td><td>${r.gapN?pc(r.gapFilled,r.gapN):'—'}</td></tr>`).join('')}</table></div>
   ${swingBlock}${periodBlock}
   ${you}<p class="muted"><small>Honest read: a few weeks of briefs is a small sample, so treat differences under about 15 points as noise. The table grows every evening.</small></p></section>`;}
 function guide(){

</script><script type="application/x-trade-desk">// Auto-tag (13 Nov): a trade in a stock that was one of that morning's brief setups gets the setup type as its tag,

  if(!d)return '<div class="hc-head"><h2>Review</h2><p>No graded setups yet. Grades appear after the close on trading days.</p></div>';
  const rows=d.setups.day,f=rows.filter(r=>r.result==='followed').length,me=d.measured,wr=d.written||{};
  const stats=tk.setupStats&&Array.isArray(tk.setupStats.day)?tk.setupStats.day:[];
  const N=stats.reduce((a,x)=>a+(+x.n||0),0),F=stats.reduce((a,x)=>a+(+x.followed||0),0);
  const lean={right:'The morning lean was right',partly:'The morning lean was partly right',wrong:'The morning lean was wrong'}[wr.verdict]||'';
  return `<div class="hc-head"><h2>${E(dayLabel(me.date))}: ${f} of ${rows.length} setups followed through</h2><p>Graded after the close against what each stock did. A grade is not a trading result.</p></div><div class="hc-grid">`
   +card('Setups, graded',rows.slice(0,7).map(r=>`<div class="hc-r"><b>${E(r.ticker||r.symbol)}</b><span class="t">${E(r.family||r.setup)}</span><span class="hp hp-${GRADE[r.result]?r.result:'nobreak'}">${GRADE[r.result]||'Not graded'}</span></div>`).join(''))
   +card('The kind of day',`<p><b>${E(me.typeLabel||'')}</b></p><p class="muted">${E(sentence(me.summary,220))}</p>`)
   +(lean||wr.whatHappened?card('The plan against the day',`${lean?`<p><b>${E(lean)}</b></p>`:''}<p class="muted">${E(sentence(wr.whatHappened,220))}</p>`,'#marketbrief','Read the close review','close'):'')
   +(N?card('The record so far',`<p class="hc-big">${F} of ${N}</p><p class="muted">day-trade setups followed through (${Math.round(100*F/N)}%) over ${E(tk.setupStats.days||'')} graded days</p>`).replace('</div></div>','</div><a class="hc-go" href="#takeaways" data-scroll="scorecard">See the full scorecard →</a></div>'):'')+'</div>';}

</script><script type="application/x-trade-desk">// Friendly dates (15 Nov 2026): wherever a page shows a date as 2026-11-15, display it as "Sunday 15 November"
// (the year is added when it is not the current year). This only changes what is displayed: stored data, form
// fields, typed notes, exports and file names keep the 2026-11-15 form.
(function(){
 const RE=/\b(\d{4})-(\d{2})-(\d{2})\b/g,SKIP={TEXTAREA:1,SCRIPT:1,STYLE:1,INPUT:1,CODE:1,PRE:1};
 const thisYear=new Date().getFullYear();
 const nice=(all,y,m,d)=>{const dt=new Date(+y,+m-1,+d);if(dt.getFullYear()!==+y||dt.getMonth()!==+m-1||dt.getDate()!==+d)return all;
  return dt.toLocaleDateString('en-GB',{weekday:'long'})+' '+(+d)+' '+dt.toLocaleDateString('en-GB',{month:'long'})+(+y!==thisYear?' '+y:'');};
 const skip=n=>{for(let e=n.parentElement;e;e=e.parentElement){if(SKIP[e.tagName]||e.isContentEditable||e.hasAttribute('data-raw-dates'))return true;}return false;};
 function sweep(root){const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);const hits=[];
  for(let n=w.nextNode();n;n=w.nextNode()){if(n.nodeValue.length>=10&&n.nodeValue.search(RE)>=0&&!skip(n))hits.push(n);RE.lastIndex=0;}
  for(const n of hits){const v=n.nodeValue.replace(RE,nice);if(v!==n.nodeValue)n.nodeValue=v;}}

 const later=()=>{if(!queued){queued=true;requestAnimationFrame(run);}};
 new MutationObserver(later).observe(document.body,{childList:true,subtree:true,characterData:true});later();})();

</script><script type="application/x-trade-desk">// Journal numbers (16 Nov 2026): two cards on the Trading journal, above the trade list.

// estimated and no AI is involved. A period switch (all time, this year, the displayed month) applies to both.
// Small samples are labelled as such instead of being ranked.

// a swing trade was held into the next trading day or longer (any part of it sold on a later date).

</script><script type="application/x-trade-desk">// Day rating (16 Nov 2026, upgrade plan R2): a thirty-second prompt at the top of the Takeaways page (Review).

(function(){

 const st=document.createElement('style');st.textContent=`
#dayRating .dr-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
#dayRating .dr-row>span{min-width:150px;color:var(--muted);font-size:13px}

.dr-dot{font-size:12px;padding:4px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}

 const E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

</script><script type="application/x-trade-desk">// Add a trade by hand (16 Nov 2026, upgrade plan J3): an "Add a trade" button on the journal's trade list opens a

 body.addEventListener('change',e=>{if(e.target&&e.target.id==='mt_sold'){const x=document.getElementById('mt_exit');if(x)x.hidden=!e.target.checked;}});

 // The "Add a trade" button beside Export CSV, and an Edit button on each hand-entered trade's row.

(function(){

.jr-stop>summary{cursor:pointer}

.jr-row input{width:130px}.jr-row button{font-size:12px;padding:7px 10px}

 const E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

</script><script type="application/x-trade-desk">// Week in review (16 Nov 2026, upgrade plan W1): a card, #weekReview, at the top of the Week page.
